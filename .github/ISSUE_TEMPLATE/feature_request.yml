name: Feature Request
description: Suggest a new feature or enhancement for SDK Forge
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please provide as much detail as possible to help us understand your use case.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What is the use case?
      placeholder: |
        I'm trying to... but I can't because...
        
        This would be useful when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working
      placeholder: |
        I would like to see...
        
        Ideally, this would work like...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: |
        I've tried...
        
        Another approach could be...
      value: ""

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area does this feature relate to?
      options:
        - Language Support (new language SDK generation)
        - Code Generation (templates, formatting, structure)
        - Authentication (auth methods, security)
        - Testing (test generation, test frameworks)
        - CLI/UX (command-line interface, user experience)
        - Documentation (docs, examples, guides)
        - Performance (speed, optimization)
        - Configuration (config files, flags, options)
        - OpenAPI Support (schema parsing, validation)
        - Other
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Target Language (if applicable)
      description: Which language(s) would this feature affect?
      options:
        - All languages
        - Python
        - Go
        - PHP (not yet supported)
        - JavaScript/TypeScript (not yet supported)
        - Language-agnostic
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples / Mockups
      description: |
        If applicable, provide examples of how this feature would be used.
        You can include code examples, command-line usage, or mockups.
      placeholder: |
        ```bash
        # Example command usage
        sdk-forge generate --new-feature ...
        ```
        
        Or provide a code example of how the generated SDK would look...
      render: shell

  - type: dropdown
    id: priority
    attributes:
      label: Priority (Your Perspective)
      description: How important is this feature to you?
      options:
        - Nice to have
        - Would be helpful
        - Important
        - Critical / Blocking
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, related issues, or information about the feature request
      placeholder: Add any other context or screenshots about the feature request here...

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have checked existing issues and discussions to see if this is already planned
          required: true
        - label: I have searched existing issues to avoid duplicates
          required: true

