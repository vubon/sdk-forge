name: Question / Support
description: Ask a question or get help with SDK Forge
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question? We're here to help! Please provide as much detail as possible.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
      placeholder: What is your question?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: |
        Provide context about what you're trying to accomplish.
        Include relevant commands, schemas, or code snippets.
      placeholder: |
        I'm trying to...
        
        I've tried...
        
        Here's my OpenAPI schema (if relevant):
        ```yaml
        ...
        ```
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Question Category
      description: What area is your question about?
      options:
        - Installation / Setup
        - Usage / How-to
        - Generated SDK Code
        - OpenAPI Schema
        - Authentication
        - Testing
        - Language Support
        - Troubleshooting
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SDK Forge Version
      description: Version of SDK Forge you're using (if applicable)
      placeholder: e.g., v0.3.0-alpha.2

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have checked the [documentation](https://github.com/vubon/sdk-forge/tree/main/docs)
          required: true
        - label: I have searched existing issues and discussions
          required: true

